# Allarmi di Banbury 1 (messaggi a bit come nel WinCC Alarm Logging).
# alarm.<numero> = <indirizzo bit> ; <Point d'erreur (Text1)> ; <Testo messaggio (Text2)> ; <classe>
# Indirizzo: DB110DBX22_3 (= DBX 22.3, formato WinCC) oppure DB110.W22.B3 (bit 3 della parola DBW22).
# Gli allarmi di B1 NON sono nel progetto WinCC fornito: servono l'elenco messaggi di Alarm Logging
# (numero, testo, tag/bit) o, in alternativa, gli screenshot dell'elenco.
#
# esempio (NON reale, da cancellare):
# alarm.1 = DB110DBX22_3 ; Pistone ; Pistone bloccato ; Errore
