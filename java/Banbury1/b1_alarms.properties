# Allarmi di Banbury 1 (messaggi a bit come nel WinCC Alarm Logging), ricavati dal progetto WinCC CC_Bambury1.
# alarm.<numero> = <indirizzo bit> ; <Point d'erreur> ; <Testo del messaggio> ; <classe>
# Indirizzo: DB113.W<byte>.B<bit> = bit <bit> della parola DBW<byte> (bit 0 = meno significativo), le 9 parole DB113.DBW0..DBW16.
# Testi e punti d'errore in francese (anche dove WinCC aveva inglese o italiano). Il numero e' quello del messaggio WinCC.
# I messaggi senza testo e senza punto d'errore (slot vuoti) non sono inclusi; quelli con solo il punto d'errore (es. PISTON) hanno testo vuoto come in WinCC. Il 999 (PLC comunication fault) e' una variabile interna di WinCC.
