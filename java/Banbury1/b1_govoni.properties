# Silos di B1 dal sistema Govoni (sola lettura, via OpcManager del progetto, come B2).
# silos_node = NodeId OPC del campo "Etat execution" della produzione BY1 (bilancia W118): R2021 (BY2/W117 = R1021).
# Vuoto = usa il valore standard ns=2;s=Govoni.SILOS.R2021.
# Se OpcManager non e' nel classpath, le spie SILOS restano quelle del PLC.
# Regola: codice 2 (Descharge Vidage) = silos APERTO (spia Ouvert verde); ogni altro stato = CHIUSO (spia Ferme rossa).
silos_node = ns=2;s=Govoni.SILOS.R2021
