# Scrittura dei dati del ticket nel database SQL di Banbury 1.
# Finche' enabled=false (o table vuota) il programma mostra l'SQL ma NON scrive.
# Password: meglio nella variabile d'ambiente B1_SQL_PASSWORD (non nel file).
enabled = false
jdbc.url = jdbc:sqlserver://srv-bambury:1433;databaseName=DATA_BAMBURY;encrypt=true;trustServerCertificate=true;loginTimeout=5
jdbc.user =
jdbc.password =
# Tabella di B1 (da confermare: es. dbo.Datas_B1) e modalita' insert|update
table =
mode = insert
# per mode=update: colonna e campo che identificano la riga da aggiornare
key.column =
key.field =
# Colonne: lasciare vuoto cio' che non va scritto. Esempio modellato su Datas_B2:
#   col.num_lot = Num_lot        col.suffixe = Suffixe       col.serie = Num_melange
#   col.couche = Type_melange    col.passage = Num_passage   col.couleur = Couleur
#   col.recipe_name = Nom_melange   col.nombre = Nbr_sequence
# Lotto completo AA/LOT (es. 26/0703)
col.num_lot =
# Anno (es. 26)
col.annee =
# Numero lotto (es. 0703)
col.lot =
# Suffisso
col.suffixe =
# Num melange / serie (A, A1...)
col.serie =
# Numero di miscele
col.nombre =
# Passaggio come testo WinCC (1er, 2eme...)
col.passage =
# Type (SUP, INF, STS, NET, MEL.MERE, PREMAST)
col.couche =
# Couleur (---, Clair, Foncé, Medium)
col.couleur =
# Nome ricetta
col.recipe_name =
# RecipeUID
col.recipe_uid =
# Data (colonna data)
col.date =
# Ora (colonna ora)
col.time =
# Data e ora (colonna datetime)
col.timestamp =
# Utente Windows
col.user =
