# Layout ricetta Banbury 1 (DB201), CONFERMATO dal database ricette del WinCC (tabelle A_RECIPE_PHASE_PARAMS/_TAGS).
# 10 fasi da 30 byte a partire da DBW42. Per ogni fase: +0 operazioni, +2 timeout, +10 set, +12 rotor, +14 pressione (x10), +20 controllo, +22 tempo, +24 temp., +26 energia (x10).
# Operazioni (bit della parola a offset 0 del blocco fase): CONFERMATE dal WinCC (btnBitJob): 0-6, 13, 14, 15 = Dech.
# Controlli (btnBitControl): et = bit 0, ou = bit 1, Skip = bit 15 (parola a offset 20, CONTROLS_word).
# Etichette confermate dal WinCC (002_Process): safety_temp, drop_door, safety_time, max_energy, restart_temp.
# Colonne WinCC (006_Recipes): Operazione = Gomme, Add., All Black, Plastif., Cerac., Silano, Half Black, Degas, Net., Dech.;
#   Set = Timeout, Rotor (rpm), Press. (bar), Porte, Piston; Controllo = Skip, Temps (s), Temp. (C), Ener. (kWh), et, ou.
# Campo: chiave = W<offset>|UW<offset> ; Etichetta ; Unita' ; Scala ; Min ; Max
# header.* = offset assoluto nel DB; phase.* = offset dall'inizio del blocco fase.
db = 201
db.size = 384
recipeno.offset = 2
name.offset = 4   # STRING S7 [max][len][caratteri]
name.max = 32
phase.base = 42
phase.size = 30
phase.count = 10
ops.offset = 0   # parola a bit delle operazioni (offset nel blocco fase)
discharge.bit = 15   # bit 'scarico' (ipotesi)
ops.bit0 = Gomme
ops.bit1 = Add.
ops.bit2 = All Black
ops.bit3 = Plastif.
ops.bit4 = Cerac.
ops.bit5 = Silano
ops.bit6 = Half Black
ops.bit13 = Degas
ops.bit14 = Net.
ops.bit15 = Déch. (scarico)
# ops.bit12 = nome operazione   (aggiungere le righe che servono)
header.safety_temp = W28 ; Temp. sicurezza ; °C ; 1.0 ; 0.0 ; 200.0
header.drop_door = W30 ; Porte de dechargement ; s ; 1.0 ; 0.0 ; 3600.0
header.safety_time = W32 ; Tempo sicurezza ; s ; 1.0 ; 0.0 ; 3600.0
header.max_energy = W34 ; Energia max ; kWh ; 0.1 ; 0.0 ; 999.9
header.restart_temp = W38 ; Temp. riavvio ; °C ; 1.0 ; 0.0 ; 200.0
phase.timeout = W2 ; Timeout (s) ; s ; 1.0 ; 0.0 ; 9999.0
phase.set_bits = UW10 ; Set: porte e pistone (bit) ;  ; 1.0 ;  ; 
phase.rpm = W12 ; Rotor ; rpm ; 1.0 ; 5.0 ; 50.0
phase.press = W14 ; Press. ; bar ; 0.1 ; 0.0 ; 500.0
phase.ctrl_bits = UW20 ; Controllo: et=bit0, ou=bit1, skip=bit15 ;  ; 1.0 ;  ; 
phase.time = W22 ; Tempo fase ; s ; 1.0 ; 0.0 ; 99999.0
phase.temp = W24 ; Temperatura ; °C ; 1.0 ; 0.0 ; 600.0
phase.energy = W26 ; Energia ; kWh ; 0.1 ; 0.0 ; 1000.0
