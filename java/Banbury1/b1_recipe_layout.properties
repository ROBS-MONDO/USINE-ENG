# Layout ricetta Banbury 1 (DB201). I campi con (?) sono IPOTESI da confermare
# confrontando l'editor con la schermata 'Vue recette' del WinCC.
# Campo: chiave = W<offset>|UW<offset> ; Etichetta ; Unita' ; Scala ; Min ; Max
# header.* = offset assoluto nel DB; phase.* = offset dall'inizio del blocco fase.
db = 201
db.size = 384
recipeno.offset = 2
name.offset = 4   # STRING S7 [max][len][caratteri]
name.max = 32
phase.base = 52
phase.size = 30
phase.count = 11
ops.offset = 20   # parola a bit delle operazioni (offset nel blocco fase)
discharge.bit = 15   # bit 'scarico' (ipotesi)
ops.bit15 = Scarico (?)
# ops.bit12 = nome operazione   (aggiungere le righe che servono)
header.safety_temp = W28 ; Temp. sicurezza (?) ; °C ; 1.0 ; 0.0 ; 200.0
header.restart_temp = W30 ; Temp. riavvio (?) ; °C ; 1.0 ; 0.0 ; 200.0
header.safety_time = W32 ; Tempo sicurezza (?) ; s ; 1.0 ; 0.0 ; 3600.0
header.max_energy = W34 ; Energia max (?) ; kWh ; 1.0 ; 0.0 ; 9999.0
header.h38 = W38 ; Parametro testata +38 (?) ;  ; 1.0 ;  ; 
header.h42 = W42 ; Parametro testata +42 (?) ;  ; 1.0 ;  ; 
header.h44 = W44 ; Parametro testata +44 (?) ;  ; 1.0 ;  ; 
phase.p0 = W0 ; Param. +0 (?) ;  ; 1.0 ;  ; 
phase.rpm = W2 ; Rotor (?) ; rpm ; 1.0 ; 0.0 ; 100.0
phase.p4 = W4 ; Param. +4 (?) ;  ; 1.0 ;  ; 
phase.p10 = W10 ; Param. +10 (?) ;  ; 1.0 ;  ; 
phase.temp = W14 ; Temp. (?) ; °C ; 1.0 ; 0.0 ; 200.0
phase.p22 = W22 ; Param. +22 (?) ;  ; 1.0 ;  ; 
