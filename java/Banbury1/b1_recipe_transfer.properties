# Invio delle ricette al PLC (DB201). Posizione: C:\_tools\Banbury1\b1_recipe_transfer.properties
# La scrittura e' DISABILITATA: finche' non cambi questi valori il pulsante "Invia al PLC" mostra solo l'ANTEPRIMA
# di cosa verrebbe scritto (parole del DB che cambiano) e i controlli, senza scrivere nulla.
#
# Per abilitare la scrittura servono TUTTE E DUE le righe a true, e solo dopo aver confermato la sequenza di
# trasferimento del WinCC (lampade Transfert recette habilite / Start transfert = DB201.DBX41.0 / Fin transfert / Recette valide):
# senza quella sequenza la CPU potrebbe non convalidare la ricetta o usarne una a meta'.
enabled = false
allow_raw_write = false
# Copia di sicurezza del DB201 salvata prima di ogni invio
backup_dir = C:\_tools\Banbury1\Recipes\backup
