# Invio delle ricette al PLC (DB201). Posizione: C:\_tools\Banbury1\b1_recipe_transfer.properties
# La scrittura e' DISABILITATA: finche' non cambi questi valori il pulsante "Invia al PLC" mostra solo l'ANTEPRIMA
# di cosa verrebbe scritto (parole del DB che cambiano) e i controlli, senza scrivere nulla.
#
# Per abilitare la scrittura servono TUTTE E DUE le righe a true. Provare prima con la macchina ferma (rotori 0) e con
# l'operatore presente. La sequenza e' quella del WinCC originale (registro B1DbDump del 16/11/2026):
#   1) a riposo DB110.DBW44 = 0x100A (bit 12 = trasferimento abilitato)
#   2) Start transfert = DB201.DBX41.0 = 1; il PLC risponde DB110.DBW44 bit 2 = 1
#   3) scrittura delle parole della ricetta (numero ricetta DBW2 per ultimo)
#   4) fine = DB201.DBX383.0 = 1 (DBW382); dopo alcuni secondi il PLC azzera Start e Fine e riporta DBW44 a 0x100A
enabled = false
allow_raw_write = false
# true = usa lo scambio di sopra (consigliato); false = solo scrittura delle parole (solo per prove su un server di prova)
handshake = true
# Attesa massima della chiusura dello scambio da parte del PLC, in secondi (nel registro: circa 9 s)
wait_seconds = 60
# Copia di sicurezza del DB201 salvata prima di ogni invio
backup_dir = C:\_tools\Banbury1\Recipes\backup
# Download dalla pagina Production: scrive anche il totale miscele della produzione in DB110.DBW210 ("Melanges total").
# La scrittura avviene PRIMA dello Start, viene riletta e ricontrollata a trasferimento chiuso; a fine trasferimento il PLC
# azzera le miscele fatte (DBW212) e ricalcola quelle da fare (DBW214 = DBW210 - DBW212), come visto nel registro del 17/11/2026.
# DA ABILITARE SOLO dopo aver confermato con un secondo registro che WinCC scrive DBW210 (produzione con quantita' diversa da 100).
write_quantity = false
