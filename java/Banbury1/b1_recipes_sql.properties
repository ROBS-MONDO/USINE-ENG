# Archivio ricette di B1 su SQL Server (come B2). Posizione: C:\_tools\Banbury1\b1_recipes_sql.properties
# Crea prima le tabelle con sql/create_b1_recipes.sql (le esegue chi amministra SQL Server).
# enabled = false: le ricette restano in file nella cartella C:\_tools\Banbury1\Recipes.
enabled = false
# Connessione centralizzata (consigliata): usa SVC.DBBamburyReader del progetto, nessuna credenziale in questo file.
# Con provider = svc gli altri parametri di connessione (jdbc.url, auth, jdbc.user, jdbc.password) sono ignorati.
provider = svc
jdbc.url = jdbc:sqlserver://srv-bambury:1433;databaseName=mondo;encrypt=true;trustServerCertificate=true;loginTimeout=5
# Modo consigliato: autenticazione Windows, nessuna password (vedi sql/grant_b1_windows_group.sql). Togli il commento alla riga seguente
# e lascia vuoti jdbc.user / jdbc.password:
# auth = windows
jdbc.user = b1_recipes
# Password: meglio nella variabile d'ambiente B1_RECIPES_SQL_PASSWORD (non nel file)
jdbc.password =
