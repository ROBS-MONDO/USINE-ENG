# Silos: chiuso (ipotesi da PDL)
silos_closed = M30.1
# Porta carico: aperta
door_load_open = DB110.W26.B0
# Porta carico: chiusa
door_load_closed = DB110.W26.B1
# Poids presseur: aperto
weight_open = DB110.W24.B2
# Poids presseur: chiuso
weight_closed = DB110.W24.B3
# Porta scarico: aperta
door_dis_open = DB110.W24.B0
# Porta scarico: chiusa
door_dis_closed = DB110.W24.B1
# Pronto: temp. min. OK avviamento
rdy_temp = DB110.W54.B0
# Pronto: scarico OK
rdy_discharge = DB110.W54.B6
# Pronto: motore principale OK
rdy_motor = DB110.W54.B7
# Pronto: porta scarico chiusa
rdy_door = DB110.W54.B8
# Pronto: tempo min. tra cicli
rdy_mintime = DB110.W54.B9
# Pronto: n. cicli passi effettuati
rdy_cycles = DB110.W54.B10
# Ciclo: auto (CONFERMATO in produzione 20/11: coincide con il modo automatico, W44.B3)
cyc_auto = DB110.W44.B3
# Modo automatico (spie AUTO/MANUAL del Display e trend). CONFERMATO in produzione 20/11: W44.B3 (acceso a riposo 0x100A e in produzione 0x3A, spento a download 0x06)
mode_auto = DB110.W44.B3
# Ciclo: continuo
cyc_cont = DB110.W54.B12
# Ciclo: sospeso
cyc_susp = DB110.W54.B15
# Ciclo: ciclo
# CONFERMATO in produzione 20/11: W44.B4
cyc_cycle = DB110.W44.B4
# Posizione carico
pos_load = DB110.W140.B11
# Decelerazione carico
decel_load = DB110.W140.B13
# Decelerazione scarico
decel_dis = DB110.W140.B12
# Posizione scarico
pos_dis = DB110.W140.B14
# Pronto per produzione
prod_ready = DB110.W44.B0
# Ciclo auto ON
# CONFERMATO in produzione 20/11: W44.B5
prod_auto_on = DB110.W44.B5
# Caricamento nuova (ipotesi da PDL)
new_load = DB201.X41.0
# Funzionamento produzione auto
# CONFERMATO in produzione 20/11: W44.B3 (il bit 1 e' 'recette valide')
prod_auto = DB110.W44.B3
# Ciclo arrestato
cycle_stopped = DB110.W44.B2
# Ricetta valida. CONFERMATO in produzione 20/11: W44.B1 (PDL sinottico; a 1 anche durante il download 0x06 e in produzione). Il bit 12 e' 'trasferimento abilitato'
recipe_ok = DB110.W44.B1
# Pistone: in movimento (osservato: si accende in salita e in discesa; la direzione si ricava dall'ultimo fine corsa)
piston_move = DB110.W22.B5
# Malaxage (Grande vue), secondi (mm:ss): tempo della fase attuale (DBW194). Il DBW198 e' l'energia della fase, non un tempo.
# CONFERMATO in produzione 20/11.
mix_time = DB110.UW194

