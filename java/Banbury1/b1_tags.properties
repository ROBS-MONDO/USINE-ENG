# Mappa tag Banbury 1 (CPU IM 151-8 F-CPU, 192.168.10.100, rack 0 slot 2)
# Sintassi: chiave = DB110.W80 | DB110.UW80 | DB110.W80*0.1 | DB110.W6.B12 | DB201.X41.0 | DB150.S6 | !DB110.W6.B3
# Riga vuota = indirizzo predefinito del programma. 'none' = volutamente non collegato (mostra '--').
# Le righe preimpostate possono essere IPOTESI da confermare (vedi DB_MAP.md).
# Premere F2 nel sinottico per vedere la chiave di ogni campo.

# Pressione (barra alta)
press_top = DB110.W70*0.1
# Temperatura camera (barra alta e riquadro)
temp = DB110.W100
# Velocita' rotori (barra alta)
speed_top = DB110.W60
# Tempo ciclo, secondi (mm:ss)
cycle_time = 
DB110.UW202
mix_total = DB110.W210
# Miscele fatte (WinCC: DBW212)
mix_done = DB110.W212
# Miscele da fare (vuoto = totali - fatte)
mix_todo = 
# Pistone: pressione consegna
press_set = DB110.W70*0.1
# Pistone: pressione attuale
press_act = DB110.W72*0.1
# Pistone: % 1
piston_pct1 = DB110.W86
# Pistone: % 2 (ipotesi: velocita' discesa)
piston_pct2 = DB110.W106
# Pistone: % 3 (ipotesi: velocita' salita)
piston_pct3 = DB110.W108
# Rotori: giri consegna
rpm_set = DB110.W58
# Rotori: giri attuali
rpm_act = DB110.W60
# Rotori: corrente (A)
current = DB110.W62
# Cycle malaxeur: passi (ipotesi)
steps = DB110.W234
# Suffisso
suffix = 
# SEQ prima cifra (ipotesi dal dump)
