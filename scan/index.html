<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Entrance check</title>
<link rel="stylesheet" href="scan.css">
</head>
<body>
<main id="app">
  <section id="login" hidden>
    <div class="langbar"><select id="lang" aria-label="Language"><option value="it">Italiano</option><option value="en">English</option><option value="ru">Русский</option></select></div>
    <h1 data-i18n="title">Controllo ingressi</h1>
    <form id="login-form">
      <input type="password" id="pw" data-i18n-ph="password" placeholder="Password staff" autocomplete="current-password" required>
      <button type="submit" data-i18n="enter">Entra</button>
      <p id="login-msg" class="msg"></p>
    </form>
  </section>

  <section id="scanner" hidden>
    <header>
      <div id="stats">—</div>
      <select id="lang2" aria-label="Language"><option value="it">IT</option><option value="en">EN</option><option value="ru">RU</option></select>
      <button type="button" id="btn-list" class="ghost" data-i18n="search">Cerca</button>
      <button type="button" id="btn-logout" class="ghost" data-i18n="logout">Esci</button>
    </header>
    <div id="viewport">
      <video id="video" playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <div id="frame"></div>
    </div>
    <p id="hint" data-i18n="hint">Inquadra il QR del biglietto</p>
    <div id="result" hidden>
      <div id="result-title"></div>
      <div id="result-name"></div>
      <div id="result-detail"></div>
      <button type="button" id="btn-next" data-i18n="next">Prossimo</button>
    </div>
  </section>

  <section id="search" hidden>
    <header>
      <button type="button" id="btn-back" class="ghost" data-i18n="back">← Scanner</button>
      <select id="lang3" aria-label="Language"><option value="it">IT</option><option value="en">EN</option><option value="ru">RU</option></select>
      <a id="btn-export" class="ghost" href="api.php?action=export" data-i18n="export">Scarica elenco CSV</a>
    </header>
    <input type="search" id="q" data-i18n-ph="searchph" placeholder="Nome, email o codice (min. 2 lettere)" autocomplete="off">
    <ul id="items"></ul>
  </section>
</main>
<script src="jsQR.js"></script>
<script src="scan.js"></script>
</body>
</html>
