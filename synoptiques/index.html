<!DOCTYPE html>
<html lang="it">
<head>

<body>
<nav>
  <button id="b1" class="on">Sinottico 2: Bambury 1</button>
  <button id="b2">Sinottico 3: Bambury 2</button>
</nav>
<svg id="scr" viewBox="275 0 1375 1023" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
/* ---------- Configurazione dei due sinottici ---------- */
const TOP = [ // silos 1..8
  ['Kaolin:'],['Kaolin:'],['ATH.'],['ATH.'],['AGER SUP'],['Craie.'],['Aspiration'],['Aspiration']];
const LOW = [ // silos 12,11,10,9
  {n:12,t:'Kaolin:'},{n:11,t:'Kaolin:'},{n:10,t:'Craie.'},{n:9,t:'Sableuse',ev:true}];
const TOPX = [420,585,750,915,1080,1250,1413,1578];
const LOWX = [1005,1170,1338,1503];
const EV_TOP = {4:'EV104',6:'EV106'};

const SCREENS = {
 1:{
  title:'SYNOPTIQUE 2: BAMBURY 1', lsl:n=>'LSL1'+String(n).padStart(2,'0'), suf:'A',
  lowLsl:n=>'LSL1'+String(n).padStart(2,'0'),
  mixer:{name:'W118',cx:712,top:445,filter:'F116',cell:'FL120',v1:'V123',v2:'V124'},
  left:{valve:'V126',fan:'GV130',gc:'GC128',pls:'PLS128'},
  panels:[{x:296,y:640,btn:'W118',silo:'----',brut:'-41.380',set:'0.000',net:'0.000'},
          {x:296,y:760,btn:'CL201',silo:'----',brut:'0.000',set:'0.000',net:'0.000'}],
  recette:{x:386,y:878,r:'A',lot:'2'},
  schemaBtn:{x:598,y:912,t:'PRODUCTION'}, planning:{x:500,y:697},
  bottomBtns:['SIn: SILOS','SIn: BY2'],
  active:null
 },
 2:{
  title:'SYNOPTIQUE 3: BAMBURY 2', lsl:n=>'LSL'+String(n).padStart(2,'0'), suf:'B',
  lowLsl:n=>'LSL'+String(n).padStart(2,'0'),
  mixer:{name:'W117',cx:688,top:440,filter:'F115',cell:'FL119',v1:'V121',v2:'V122'},
  left:{valve:'V125',fan:'GV127',gc:'GC127',pls:'PSL127',arrows:true},
  panels:[{x:298,y:632,btn:'W117',silo:'S3',brut:'140.080',set:'60.000',net:'137.720'},
          {x:298,y:750,btn:'CL200',silo:'----',brut:'0.000',set:'0.000',net:'0.000'}],
  recette:{x:362,y:870,r:'RFL18',lot:''},
  schemaBtn:{x:566,y:910,t:'PRODUCTION'}, planning:{x:757,y:680},
  bottomBtns:['SIn: SILOS','SIn: BY1'],
  active:3
 }
};

/* ---------- Helper SVG ---------- */
const NS='http://www.w3.org/2000/svg';
let out;
const A=(o)=>Object.entries(o).map(([k,v])=>`${k}="${v}"`).join(' ');
const R=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${A(o)}/>`;
const C=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" ${A(o)}/>`;
const P=(d,o={})=>`<path d="${d}" ${A(o)}/>`;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-family="Arial" ${A(o)}>${s}</text>`;
const pipe=d=>P(d,{fill:'none',stroke:'#6a6a6a','stroke-width':11,'stroke-linejoin':'round'})+
              P(d,{fill:'none',stroke:'url(#pipeG)','stroke-width':7,'stroke-linejoin':'round'});
const led=(x,y,on=true,col='#00e000')=>C(x,y,9,{fill:on?col:'#8a8a8a',stroke:'#444'});
const redLed=(x,y)=>C(x,y,9,{fill:'#e00000',stroke:'#444'});

const defs=`<defs>
 <linearGradient id="pipeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bdbdbd"/></linearGradient>
 <linearGradient id="orG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a4a10"/><stop offset=".35" stop-color="#e8a050"/><stop offset="1" stop-color="#a35c18"/></linearGradient>
 <pattern id="screw" width="6" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L6 0" stroke="#222" stroke-width="1.4"/></pattern>
 <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 0H5M0 0V5" stroke="#5a3200" stroke-width="1"/></pattern>
</defs>`;

const nn=n=>String(n).padStart(2,'0');
/* ---------- Componenti ---------- */
function siloBody(cx,y,{ev=null}={}){
  let s='';
  s+=P(`M${cx-52} ${y} H${cx+52} V${y+50} L${cx+18} ${y+78} H${cx-18} L${cx-52} ${y+50}Z`,{fill:'url(#orG)',stroke:'#5a3000'});
  s+=P(`M${cx-52} ${y+50} L${cx-18} ${y+78} M${cx+52} ${y+50} L${cx+18} ${y+78}`,{stroke:'#5a3000'});
  s+=P(`M${cx-38} ${y+62} l14 -10 M${cx+38} ${y+62} l-14 -10`,{stroke:'#ddd','stroke-width':3});
  if(ev){ // rotary valve
    s+=R(cx-22,y+55,44,10,{fill:'url(#orG)',stroke:'#333'});
    s+=R(cx-40,y+36,20,26,{fill:'#555',stroke:'#222'});
    s+=C(cx-70,y+32,12,{fill:'#777',stroke:'#222'})+R(cx-82,y+22,22,20,{fill:'#555',stroke:'#222',rx:4});
  }
  return s;
}
function siloTop(cx,y,title,lsl,num,ev){
  let s=R(cx-60,y,120,25,{fill:'#0000ff'})+T(cx,y+20,title,{fill:'#fff','font-size':20,'text-anchor':'middle'});
  s+=siloBody(cx,y+25,{ev});
  s+=T(cx-45,y+46,lsl,{'font-size':14,'font-weight':'bold'})+led(cx-10,y+55)+
     T(cx+50,y+56,num,{'font-size':34,'text-anchor':'end'});
  return s;
}
function feeder(cx,y0,fl,screw,valve,{on=false,open=false,ev=false}={}){ // y0 = silo cone bottom
  const vx=cx-58, sy=y0+75;
  let s='';
  s+=pipe(`M${cx} ${y0} V${y0+25} Q${cx} ${y0+40} ${cx+14} ${y0+40} Q${cx+22} ${y0+40} ${cx+22} ${y0+55} V${sy-2}`);
  s+=R(cx+12,sy-4,16,6,{fill:'#c47a2c',stroke:'#5a3000'});
  // flowmeter
  const fx=cx-85, fy=y0-30;
  if(!ev){
  s+=P(`M${fx} ${fy+15} H${cx+10} V${y0+35}`,{stroke:'#555','stroke-dasharray':'3 3',fill:'none'});
  s+=C(fx+12,fy-18,10,{fill:'#999',stroke:'#333'})+P(`M${fx+12} ${fy-8} V${fy+8}`,{stroke:'#333','stroke-width':3});
  s+=R(fx,fy+4,24,22,{fill:'#ddd',stroke:'#333'})+R(fx-6,fy,6,30,{fill:'#bbb',stroke:'#333'})+R(fx+24,fy,6,30,{fill:'#bbb',stroke:'#333'});
  s+=T(fx+14,fy+54,fl,{'font-size':19,'font-weight':'bold','text-anchor':'middle'});
  }
  // screw
  const sx=cx-110;
  s+=R(sx+40,sy,70,22,{fill:on?'#ffd800':'#fff',stroke:'#222'})+R(sx+40,sy,70,22,{fill:'url(#screw)'});
  s+=R(sx,sy-4,42,30,{fill:'#999',stroke:'#222',rx:3})+C(sx+17,sy+11,10,{fill:'#555',stroke:'#222'});
  if(on) s+=led(sx+48,sy+11,true);
  s+=T(sx-28,sy+48,screw,{'font-size':19,'font-weight':'bold'});
  // vertical pipe + valve
  s+=pipe(`M${vx} ${sy+22} V355`);
  const vy=sy+68;
  s+=R(vx-9,vy-6,18,12,{fill:open?'#00e000':'#ddd',stroke:'#333'})+R(vx-12,vy-12,24,4,{fill:'#888'})+R(vx-12,vy+8,24,4,{fill:'#888'});
  s+=led(vx+30,vy-4)+led(vx+45,vy-4,false);
  s+=T(vx+25,vy+22,valve,{'font-size':19,'font-weight':'bold'});
  return s;
}
function feederLow(cx,y0,fl,screw,valve,{ev}){ // y0 = cone bottom of the lower silos
  const vx=cx-48, sy=y0+75;
  let s='';
  s+=pipe(`M${cx} ${y0} V${y0+22} Q${cx} ${y0+36} ${cx+14} ${y0+36} Q${cx+22} ${y0+36} ${cx+22} ${y0+50} V${sy-2}`);
  const fx=cx-90, fy=y0-30;
  if(!ev){
  s+=P(`M${fx} ${fy+15} H${cx+10} V${y0+30}`,{stroke:'#555','stroke-dasharray':'3 3',fill:'none'});
  s+=C(fx+12,fy-18,10,{fill:'#999',stroke:'#333'})+R(fx,fy+4,24,22,{fill:'#ddd',stroke:'#333'})+R(fx-6,fy,6,30,{fill:'#bbb',stroke:'#333'})+R(fx+24,fy,6,30,{fill:'#bbb',stroke:'#333'});
  s+=T(fx+14,fy+54,fl,{'font-size':19,'font-weight':'bold','text-anchor':'middle'});
  }
  const sx=cx-105;
  s+=R(sx+40,sy,70,22,{fill:'#fff',stroke:'#222'})+R(sx+40,sy,70,22,{fill:'url(#screw)'});
  s+=R(sx,sy-4,42,30,{fill:'#999',stroke:'#222',rx:3})+C(sx+17,sy+11,10,{fill:'#555',stroke:'#222'});
  s+=T(sx-28,sy+48,screw,{'font-size':19,'font-weight':'bold'});
  s+=pipe(`M${vx} ${sy+22} V658`);
  const vy=sy+42;
  s+=R(vx-9,vy-6,18,12,{fill:'#ddd',stroke:'#333'})+R(vx-12,vy-12,24,4,{fill:'#888'})+R(vx-12,vy+8,24,4,{fill:'#888'});
  s+=led(vx+30,vy-4)+led(vx+45,vy-4,false);
  s+=T(vx+20,vy+22,valve,{'font-size':19,'font-weight':'bold'});
  return s;
}
function pump(x,y,label,lx,ly){
  return C(x,y,15,{fill:'#ddd',stroke:'#333'})+C(x,y,7,{fill:'#999',stroke:'#333'})+T(lx,ly,label,{'font-size':19,'font-weight':'bold'});
}
function inlineValve(x,y,label,lx,ly){
  return R(x-10,y-8,20,16,{fill:'#ddd',stroke:'#333'})+R(x-3,y-22,6,14,{fill:'#555'})+C(x,y-28,10,{fill:'#999',stroke:'#333'})+
         T(lx,ly,label,{'font-size':19,'font-weight':'bold'});
}
function panel(x,y,w,h,rows,{btn=null,inv=null}={}){
  let s=R(x,y,w,h,{fill:'#b4b4b4',stroke:'#666'});
  rows.forEach((r,i)=>{
    const yy=y+22+i*26;
    s+=T(x+12,yy+5,r[0],{'font-size':15,fill:'#0000d0'})+R(x+62,yy-10,86,22,{fill:'#fff',stroke:'#666'})+
       T(x+142,yy+6,r[1],{'font-size':15,'text-anchor':'end'});
  });
  return s;
}
function button(x,y,w,h,t,{fill='#6a6aff',fs=16,col='#00009a'}={}){
  return `<g class="btn">`+R(x,y,w,h,{fill,stroke:'#fff'})+R(x+1,y+1,w,h,{fill:'none',stroke:'#444'})+
         T(x+w/2,y+h/2+5,t,{'font-size':fs,fill:col,'text-anchor':'middle'})+`</g>`;
}
function flatBtn(x,y,w,h,t,fs=16,fill='#c4c4c4'){
  return `<g class="btn">`+R(x,y,w,h,{fill,stroke:'#eee'})+R(x+1,y+1,w-1,h-1,{fill:'none',stroke:'#555'})+
         T(x+w/2,y+h/2+5,t,{'font-size':fs,'text-anchor':'middle'})+`</g>`;
}

/* ---------- Parti comuni ---------- */
function header(c){
  return R(281,7,205,56,{fill:'#fff',stroke:'#444'})+
    T(383,38,'GSBI',{'font-size':34,'font-weight':'bold','font-style':'italic','text-anchor':'middle',fill:'#00229a'})+
    R(285,41,197,18,{fill:'#0020c0'})+T(383,55,'govoni sim bianca impianti',{'font-size':12,fill:'#fff','text-anchor':'middle','font-weight':'bold'})+
    R(490,7,935,56,{fill:'#c8ffc8',stroke:'#444'})+T(958,50,c.title,{'font-size':26,'text-anchor':'middle'})+
    R(1430,7,205,56,{fill:'#fff',stroke:'#444'})+R(1433,22,30,34,{fill:'#0030a0'})+
    T(1548,53,'MONDO',{'font-size':40,'font-weight':'bold','text-anchor':'middle',fill:'#000',textLength:150});
}
function footer(c){
  let s=R(281,958,155,60,{fill:'#fff',stroke:'#444'})+T(358,984,'<tspan id="clk">16:12:44</tspan>',{'font-size':20,'text-anchor':'middle'})+
        T(358,1010,'<tspan id="dte">10/27/2026</tspan>',{'font-size':20,'text-anchor':'middle'});
  s+=R(440,958,925,60,{fill:'#c0c0c0',stroke:'#eee'});
  s+=flatBtn(446,963,122,22,'Product.',17)+flatBtn(572,963,120,22,'Archive',17)+
     flatBtn(446,990,122,22,'Synoptiques',15,'#b8b8b8')+flatBtn(572,990,120,22,'Historique',15,'#b8b8b8');
  s+=R(704,963,650,20,{fill:'#000'})+T(708,978,'21-ott &#160;&#160;&#160;10:20 &#160;Niveau minimum LSL104 d&#233;couvert',{'font-size':14,fill:'#fff'});
  s+=flatBtn(1332,963,22,20,'&#8801;',14);
  s+=flatBtn(706,990,100,24,'Recette',18,'#d8d8d8')+flatBtn(810,990,124,24,'RESET MAN',18,'#d8d8d8')+
     R(938,990,232,24,{fill:'#0000ff'})+T(1054,1008,'SELECTION PAGE',{'font-size':18,fill:'#0000b0','text-anchor':'middle'})+
     T(1236,1001,'ADMIN',{'font-size':13})+T(1300,1015,'MASTER',{'font-size':13});
  s+=R(1370,958,258,60,{fill:'#c0c0c0',stroke:'#eee'});
  s+=flatBtn(1377,963,122,22,'Alerte',17)+flatBtn(1503,963,122,22,'rEset Allert',17)+
     flatBtn(1377,990,122,22,'PASSWORD',15,'#b8b8b8')+flatBtn(1503,990,122,22,'taCitate',15,'#b8b8b8');
  return s;
}

/* ---------- Costruzione di un sinottico ---------- */
function build(id){
  const c=SCREENS[id]; let s=defs+header(c);
  const names=['Kaolin:','Kaolin:','ATH.','ATH.','AGER SUP','Craie.','Aspiration','Aspiration'];

  // Tubazioni principali (sotto i componenti)
  s+=pipe('M365 355 H1588 V660 H858')+pipe('M318 355 V382 H850 V472 H776');
  s+=P('M848 656 l16 0 l-8 14z',{fill:'#222'})+P('M300 408 l24 0 l-6 20z',{fill:'#222'});

  // silos 1..8
  TOPX.forEach((cx,i)=>{
    const n=i+1, y=75;
    s+=siloTop(cx,y,names[i],c.lsl(n),n,!!EV_TOP[n]);
    s+=feeder(cx,y+25+78,`FL10${n}`,`C10${n}${c.suf}`,`V10${n}${c.suf}`,{on:c.active===n,open:c.active===n,ev:!!EV_TOP[n]});
    if(EV_TOP[n]) s+=T(cx-55,195,EV_TOP[n],{'font-size':19,'font-weight':'bold','text-anchor':'middle'});
  });
  // silos 12..9
  LOW.forEach((d,i)=>{
    const cx=LOWX[i], y=375;
    s+=siloTop(cx,y,d.t,c.lowLsl(d.n),d.n,!!d.ev);
    s+=feederLow(cx,y+25+78,`FL1${nn(d.n)}`,`C1${nn(d.n)}${c.suf}`,`V1${nn(d.n)}${c.suf}`,{ev:d.ev});
    if(d.ev) s+=T(cx-57,495,'EV109',{'font-size':19,'font-weight':'bold','text-anchor':'middle'});
  });
  // mixer
  const m=c.mixer, mx=m.cx;
  s+=pipe(`M${mx} 585 V790`);
  s+=R(mx-30,402,60,40,{fill:'url(#mesh)',stroke:'#5a3200'})+R(mx-32,398,64,8,{fill:'#c47a2c',stroke:'#5a3200'});
  s+=C(mx+40,404,10,{fill:'#999',stroke:'#333'})+T(mx+60,430,m.filter,{'font-size':19,'font-weight':'bold'});
  s+=P(`M${mx-63} 452 Q${mx-63} 442 ${mx-50} 442 H${mx+50} Q${mx+63} 442 ${mx+63} 452 V535 L${mx+22} 585 H${mx-22} L${mx-63} 535Z`,{fill:'url(#orG)',stroke:'#5a3000'});
  s+=T(mx,512,m.name,{'font-size':38,'text-anchor':'middle',fill:'#111'});
  s+=P(`M${mx-120} 543 H${mx+120}`,{stroke:'#222','stroke-width':3})+P(`M${mx-100} 543 l12 -20 l12 20z`,{fill:'#111'})+P(`M${mx+90} 543 l12 -20 l12 20z`,{fill:'#111'});
  s+=C(mx-70,600,10,{fill:'#999',stroke:'#333'})+R(mx-68,590,26,20,{fill:'#ddd',stroke:'#333'})+T(mx-86,583,m.cell,{'font-size':19,'font-weight':'bold','text-anchor':'middle'});
  s+=R(mx-9,618,18,12,{fill:'#ddd',stroke:'#333'})+led(mx+34,628)+led(mx+49,628,false)+T(mx+22,654,m.v1,{'font-size':19,'font-weight':'bold'});
  s+=R(mx-9,676,18,12,{fill:'#ddd',stroke:'#333'})+led(mx-34,689)+led(mx-18,689,false)+T(mx-16,716,m.v2,{'font-size':19,'font-weight':'bold','text-anchor':'middle'});
  // Banbury
  const bx=id===1?592:566;
  s+=R(bx+36,782,40,40,{fill:'#c47a2c',stroke:'#5a3000'})+R(bx+28,822,56,8,{fill:'#d8924a',stroke:'#5a3000'});
  s+=R(bx,822,118,88,{fill:'url(#orG)',stroke:'#5a3000'})+C(bx+28,862,19,{fill:'none',stroke:'#222','stroke-width':2})+C(bx+88,862,19,{fill:'none',stroke:'#222','stroke-width':2})+
     P(`M${bx+28} 850v24M${bx+16} 862h24M${bx+88} 850v24M${bx+76} 862h24`,{stroke:'#222','stroke-width':2});

  // lato sinistro: aspirazione, ventilatore, pannelli
  const L=c.left;
  s+=pipe('M505 565 V420 H395')+pipe('M345 415 H680');
  s+=R(339,404,54,22,{fill:'#00e0c0',stroke:'#444',rx:11})+T(397,456,L.valve,{'font-size':19,'font-weight':'bold','text-anchor':'middle'})+
     led(366,440,true)+led(366,458,false);
  s+=R(296,483,196,92,{fill:'none',stroke:'#222','stroke-width':2});
  s+=C(327,507,22,{fill:'#ddd',stroke:'#333'})+C(329,506,9,{fill:'#00c000',stroke:'#333'})+
     R(390,520,34,50,{fill:'#555',stroke:'#222'})+R(405,562,34,16,{fill:'#777',stroke:'#222'});
  s+=T(338,553,L.fan,{'font-size':19,'font-weight':'bold','text-anchor':'middle'})+T(430,600,L.gc,{'font-size':19,'font-weight':'bold','text-anchor':'middle'});
  s+=T(488,505,L.pls,{'font-size':19,'font-weight':'bold',transform:'rotate(-90 488 505)','text-anchor':'middle'})+
     C(484,547,12,{fill:'#009000',stroke:'#222'})+T(484,551,'P',{'font-size':10,fill:'#fff','text-anchor':'middle'});
  if(L.arrows) s+=P('M300 478 l14 -22 l14 22 h-8 v-4 h-12 v4z',{fill:'#0030ff'})+P('M386 545 l-24 -12 v8 h-20 v8 h20 v8z',{fill:'#00e000'});
  s+=R(526,452,76,92,{fill:'#c8c8c8',stroke:'#666'})+T(533,472,'Desch.',{'font-size':15,fill:'#0000d0'})+
     flatBtn(534,483,60,24,'START',15,'#d8d8d8')+flatBtn(534,512,60,24,'STOP',15,'#d8d8d8');
  s+=flatBtn(296,606,172,30,'RESTART',14);
  c.panels.forEach(p=>{
    s+=panel(p.x,p.y,193,117,[['Silo',p.silo],['Brut',p.brut],['Set',p.set],['Net',p.net]]);
    s+=button(p.x+198,p.y+0,62,34,p.btn,{fs:14});
  });
  s+=R(c.recette.x,c.recette.y,190,70,{fill:'#c0c0c0',stroke:'#666'})+
     T(c.recette.x+6,c.recette.y+32,'Recette:',{'font-size':20,'font-weight':'bold'})+R(c.recette.x+95,c.recette.y+10,90,26,{fill:'#fff',stroke:'#666'})+T(c.recette.x+102,c.recette.y+29,c.recette.r,{'font-size':16})+
     T(c.recette.x+6,c.recette.y+62,'Lot :',{'font-size':20,'font-weight':'bold'})+R(c.recette.x+95,c.recette.y+42,90,26,{fill:'#fff',stroke:'#666'})+T(c.recette.x+102,c.recette.y+61,c.recette.lot,{'font-size':16});
  s+=button(c.planning.x,c.planning.y,id===1?124:122,38,'PLANNING',{fs:16,col:'#202090'});
  s+=button(c.schemaBtn.x,c.schemaBtn.y,id===1?124:122,38,c.schemaBtn.t,{fs:16,col:'#202090'});
  s+=button(id===1?914:914,923,102,32,c.bottomBtns[0],{fs:13})+button(1020,923,102,32,c.bottomBtns[1],{fs:13});

  s+= id===1 ? lowerRight1() : lowerRight2();
  s+=footer(c);
  return s;
}

/* ---------- Zona inferiore destra: specifica per sinottico ---------- */
function cistern(x,y){
  return R(x-30,y,60,18,{fill:'#c47a2c',stroke:'#5a3000'})+R(x-30,y-6,60,6,{fill:'#555'})+
         P(`M${x-26} ${y+18} H${x+26} V${y+60} L${x+12} ${y+90} H${x-12} L${x-26} ${y+60}Z`,{fill:'url(#orG)',stroke:'#5a3000'})+
         T(x,y+14,'CISTERNA',{'font-size':14,'text-anchor':'middle','font-weight':'bold'})+

/* ---------- Avvio ---------- */
const svg=document.getElementById('scr');
function show(id){
  svg.innerHTML=build(id);
  document.getElementById('b1').classList.toggle('on',id===1);
  document.getElementById('b2').classList.toggle('on',id===2);
  location.hash='s'+id; tick();
}
function tick(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const c=document.getElementById('clk'), e=document.getElementById('dte');
  if(c) c.textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  if(e) e.textContent=`${p(d.getMonth()+1)}/${p(d.getDate())}/${d.getFullYear()}`;
}
document.getElementById('b1').onclick=()=>show(1);
document.getElementById('b2').onclick=()=>show(2);
setInterval(tick,1000);
show(location.hash==='#s2'?2:1);
</script>
